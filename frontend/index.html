<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Job Queue — a dashboard for creating, running, and monitoring background jobs."
    />
    <meta name="theme-color" content="#0f1318" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1318'/%3E%3Crect x='8' y='8' width='16' height='2.5' rx='1.25' fill='%237c8cff'/%3E%3Crect x='12' y='15' width='12' height='2.5' rx='1.25' fill='%2334d399'/%3E%3Crect x='16' y='22' width='8' height='2.5' rx='1.25' fill='%23f0b429'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Job Queue · Dashboard</title>
    <script>
      (function () {
        var key = 'jobqueue-theme';
        var theme = 'dark';
        try {
          var stored = window.localStorage.getItem(key);
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
